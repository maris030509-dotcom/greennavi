# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    adapter: mysql2
    encoding: utf8mb4
    database: greennavi
    username: root
    password: "password"
    host: localhost
    pool: 5

  cache:
    adapter: mysql2
    encoding: utf8mb4
    database: greennavi_cache
    username: root
    password: "password"
    host: localhost
    pool: 5

  queue:
    adapter: mysql2
    encoding: utf8mb4
    database: greennavi_queue
    username: root
    password: "password"
    host: localhost
    pool: 5

  cable:
    adapter: mysql2
    encoding: utf8mb4
    database: greennavi_cable
    username: root
    password: "password"
    host: localhost
    pool: 5
